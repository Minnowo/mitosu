# mitosu.conf: settings for `mitosu serve`. Copy to
# ~/.config/mitosu/mitosu.conf and check with `mitosu check-config`.
# One `key = value` per line; # starts a comment. Keys left out keep
# their defaults (shown commented out).

# Servers to pull, by their name in ~/.ssh/config (one line each). Their
# host keys must already be in known_hosts, and their keys must work
# without a passphrase prompt (ssh-agent or an unencrypted key).
host = myserver

# How often each server is pulled (30s to 24h). kanshi keeps its own
# history, so a pause loses nothing as long as it is shorter than
# kanshi's keep_days.
#pull_interval = 5m

# The history database.
#db = ~/.local/share/mitosu/mitosu.db

# Storage tiers, finest first: raw (every sample) or a bucket size, then
# how long it is kept (or forever). Setting any tier replaces all three.
#tier = raw 30d
#tier = 1m 1y
#tier = 1h forever

# Where the web UI listens. 127.0.0.1 keeps it on this machine.
#listen = 127.0.0.1:7878

# Other names the browser may use for this server (besides IP addresses
# and localhost), such as a LAN name. One line each.
#allowed_host = mitosu.lan

# Login with the password set by `mitosu passwd`. off: no login at all.
#login = on

# Serve HTTPS with these PEM files (both or neither).
#tls_cert = /path/to/cert.pem
#tls_key = /path/to/key.pem
